<div>

  <h3 class="text-lg font-semibold text-gray-700 mb-3">Tâches</h3>

  <div class="space-y-3">
    @for (task of tasks(); track task.id) {
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [assigneeName]="assigneeName(task.assigneeId)" />
    } @empty {
      <p class="text-gray-500 italic bg-gray-50 rounded-lg p-4 text-center">
        Aucune tâche
      </p>
    }
  </div>

</div>
